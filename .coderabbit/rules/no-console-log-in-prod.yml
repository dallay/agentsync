id: no-console-log-in-prod
language: TypeScript
severity: error
message: |
  Do not use `console.log` in shipped code. Use the project logger (`tracing`
  on the Rust side) or a deliberate stderr message with `console.error`.
note: |
  The npm wrapper may use `console.error` for fatal launch failures only.
rule:
  pattern: console.log($$$ARGS)
