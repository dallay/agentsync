name: Code Quality Analysis

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'docs/**'
      - 'qa/**'
      - 'refactor/**'
      - 'perf/**'
      - 'chore/**'
      - 'ci/**'
  pull_request:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'docs/**'
      - 'qa/**'
      - 'refactor/**'
      - 'perf/**'
      - 'chore/**'
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage-and-analysis:
    name: Coverage and SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      AGENTSYNC_LOCAL_SKILLS_REPO: ${{ github.workspace }}/agents-skills

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout committed agents-skills source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dallay/agents-skills
          ref: c2e79fbb72d146305f82a8e979270795557d24fd
          path: agents-skills
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Generate Rust coverage reports
        run: |
          cargo llvm-cov clean --workspace
          mkdir -p target/coverage
          cargo llvm-cov --workspace --all-features --lcov --output-path target/coverage/rust.lcov.info
          cargo llvm-cov report --cobertura --output-path target/coverage/rust-cobertura.xml

      - name: Analyze with SonarCloud
        if: ${{ env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >-
            -Dsonar.projectBaseDir=.
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
