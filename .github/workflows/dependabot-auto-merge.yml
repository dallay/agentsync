name: Auto-merge dependencies
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    uses: dallay/common-actions/.github/workflows/dependabot-auto-merge.yml@v2.2.2
    with:
      target: squash
      approve: true
    secrets: inherit