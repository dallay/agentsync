name: Auto-merge dependencies
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    if: |
      github.actor == 'renovate[bot]' ||
      github.actor == 'dependabot[bot]' ||
      github.actor == 'dependabot-preview[bot]'
    uses: dallay/common-actions/.github/workflows/dependabot-auto-merge.yml@8dd14d86a6bf1a4673aba902e3c3e27993b0e583 # v2.9.1
    with:
      target: squash
      approve: true
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      token: ${{ secrets.token }}
