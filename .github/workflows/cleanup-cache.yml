name: Cleanup caches

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    uses: dallay/common-actions/.github/workflows/cleanup-cache.yml@8dd14d86a6bf1a4673aba902e3c3e27993b0e583 # v2.9.1
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
