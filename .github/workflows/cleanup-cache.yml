name: Cleanup caches

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    uses: dallay/common-actions/.github/workflows/cleanup-cache.yml@5efa6a4c8865caf90a607cc5d5232564312048fd # v2.3.0
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
