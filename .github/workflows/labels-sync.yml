name: Sync Labels

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    uses: dallay/common-actions/.github/workflows/labels-sync.yml@5efa6a4c8865caf90a607cc5d5232564312048fd # v2.3.0
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
