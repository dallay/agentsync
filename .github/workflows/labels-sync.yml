name: Sync Labels

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    uses: dallay/common-actions/.github/workflows/labels-sync.yml@8dd14d86a6bf1a4673aba902e3c3e27993b0e583 # v2.9.1
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
