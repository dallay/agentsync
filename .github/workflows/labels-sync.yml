name: Sync Labels

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    uses: dallay/common-actions/.github/workflows/labels-sync.yml@41955beeb4a91c4d982d4811b07cd7ffa347ecd2 # v2.9.3
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
