[package]
name = "agentsync"
version = "1.52.0"
edition = "2024"
rust-version = "1.89"
description = "A fast CLI tool to sync AI agent configurations and MCP servers across Claude, Copilot, Cursor, and more using symbolic links."
license = "MIT"
repository = "https://github.com/dallay/agentsync"
homepage = "https://github.com/dallay/agentsync"
documentation = "https://github.com/dallay/agentsync#readme"
readme = "README.md"
keywords = ["ai", "agents", "cli", "configuration", "mcp"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Yuniel Acosta <yunielacosta738@gmail.com>"]
exclude = [
    ".github/",
    ".gitignore",
    "*.md",
    "!README.md",
]

[dependencies]
bytes = "1.11.1"
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Config parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.0"
toml_edit = "0.25.0"
serde_yaml = "0.9"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
zip = "8"
flate2 = { version = "1.0", features = ["zlib"] }
tar = "0.4"
sha2 = "0.11"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Terminal output
colored = "3.0"
dialoguer = "0.12"

# File system
walkdir = "2.5"

# Path handling
pathdiff = "0.2"
dirs = "7"

# HTTP + async runtime (added for skills.sh integration feature)
reqwest = { version = "0.13.3", features = ["json", "gzip", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
futures-util = "0.3"
lazy_static = "1.4"

# Semantic versioning for skill update resolution
semver = "1.0"

# Terminal detection for update check
is-terminal = "0.4"

# Temp directories for skill archive extraction
tempfile = "3.15"
urlencoding = "2.1"
url = "2.5"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"
cap-std = "=3.4.4"
cap-fs-ext = "=3.4.4"
rand = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
xattr = "1.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(any(target_os = "macos", target_os = "freebsd"))'.dependencies]
exacl = "=0.13.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
renamore = "=0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Wdk_Storage_FileSystem",
] }

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3    # Optimize for speed over size

[[bin]]
name = "agentsync"
path = "src/main.rs"

[lib]
name = "agentsync"
path = "src/lib.rs"
