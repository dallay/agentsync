packages:
  - npm/agentsync
  - website/docs

catalog:
  '@dallay/agentsync': 1.52.2
  '@semantic-release/changelog': ^7.0.0
  '@semantic-release/exec': ^7.1.0
  '@semantic-release/git': ^11.0.0
  '@semantic-release/github': ^12.0.2
  '@semantic-release/npm': ^13.1.3
  conventional-changelog-conventionalcommits: ^10.0.0
  semantic-release: ^25.0.2

minimumReleaseAge: 4320 # 3 days

minimumReleaseAgeExclude:
  - '@dallay/*'
  - '@biomejs/*'
  - '@iconify/*'
  # Renovate security update: astro@6.1.6 || 7.2.8
  - astro@6.1.6 || 7.2.8
  # Renovate security update: sharp@0.35.0 || 0.35.4
  - sharp@0.35.0 || 0.35.4
  # Security fix GHSA-rj75-hqrm-r3gf: only 0.44.3 moves postcss-nested to ^7.0.2,
  # which pulls postcss-selector-parser >=7.1.6 (vulnerable <7.1.6)
  - '@expressive-code/core@0.44.3'

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
